name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh
      - name: ruff
        run: pipx run ruff check kortex.py tests/
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  end-to-end:
    # kortex through D-Bus as KRunner calls it, against a real `opencode serve` and a
    # test model on localhost (tests/e2e.py).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: python3-dbus, python3-gi and the D-Bus daemon
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-dbus python3-gi dbus
      - name: opencode
        run: npm install --global --prefix "$HOME/.local" opencode-ai
      - name: End-to-end
        run: KORTEX_OPENCODE="$HOME/.local/bin/opencode" /usr/bin/python3 tests/e2e.py

  end-to-end-hermes:
    # The same through Hermes Agent's API server, installed as patina installs it: the
    # installer of a release tag, pinned to that tag's commit, without its browser parts.
    runs-on: ubuntu-24.04
    env:
      HERMES_TAG: v2026.9.24
      HERMES_COMMIT: f97608f178d1ffeca59860195ab7da295f7c8e5f
    steps:
      - uses: actions/checkout@v5
      - name: python3-dbus, python3-gi and the D-Bus daemon
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-dbus python3-gi dbus
      - name: Hermes Agent
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hermes-install.sh" \
            "https://raw.githubusercontent.com/NousResearch/hermes-agent/$HERMES_TAG/scripts/install.sh"
          bash "$RUNNER_TEMP/hermes-install.sh" --non-interactive --commit "$HERMES_COMMIT" \
            --skip-browser --skip-computer-use < /dev/null
      - name: End-to-end
        run: KORTEX_HERMES="$(command -v hermes || echo "$HOME/.local/bin/hermes")" /usr/bin/python3 tests/e2e.py hermes
